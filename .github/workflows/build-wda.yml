name: Build WebDriverAgent IPA

# 在 GitHub 网页上点 Actions -> Build WebDriverAgent IPA -> Run workflow 即可。
# 编译出的 IPA 在本次运行的 Artifacts 里下载，下载后用 Sideloadly 签名装到 iPhone。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WebDriverAgent source
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
          path: WDA

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Make bundle id unique (avoid conflicts)
        working-directory: WDA
        run: |
          # 改成一个不容易重复的 id，Sideloadly 重签时会再改成你自己的
          sh scripts/set-bundle-id.sh com.example.wda.$RANDOM 2>/dev/null || true
          echo "bundle id prepared"

      - name: Build WebDriverAgentRunner (unsigned)
        working-directory: WDA
        run: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Pack unsigned IPA
        run: |
          APP=$(find WDA/DerivedData -type d -name 'WebDriverAgentRunner.app' | head -n 1)
          if [ -z "$APP" ]; then echo "BUILD FAILED: .app not found"; exit 1; fi
          echo "app at: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -q -r WebDriverAgent.ipa Payload
          ls -lh WebDriverAgent.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-unsigned
          path: WebDriverAgent.ipa
          retention-days: 30
